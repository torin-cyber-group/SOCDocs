name: Build bundle PDFs

on:
  push:
    branches:
      - main
    paths:
      - "**/final.md"
      - ".github/scripts/build_bundle_pdfs.py"
      - ".github/workflows/build-bundle-pdfs.yml"
      - "requirements-pdf.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-bundle-pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pdf.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libharfbuzz-subset0 \
            libharfbuzz0b \
            libpango-1.0-0 \
            libpangoft2-1.0-0

      - name: Install PDF tooling
        run: |
          python -m pip install --requirement requirements-pdf.txt
          npm install --global @mermaid-js/mermaid-cli@11.16.0

      - name: Generate bundle PDFs
        run: python .github/scripts/build_bundle_pdfs.py

      - name: Commit generated PDFs
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain --untracked-files=all -- ':(glob)**/final.pdf')" ]]; then
            echo "All bundle PDFs are current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)**/final.pdf'
          git commit -m "chore: regenerate bundle PDFs"
          git push
